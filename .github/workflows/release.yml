name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      # The bump below merges with GITHUB_TOKEN, which does not re-trigger
      # workflows. This is for a human merging such a PR: without it, every
      # release bump would start another release.
      - "deploy/**"
      - "**.md"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: vars
        run: |
          IMAGE="$(echo "${REGISTRY}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAG="main-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      # A release used to `git push` straight to main and died on GH013 ("changes
      # must be made through a pull request"). The bot now does what everything else
      # in this estate does: opens a PR and merges it.
      #
      # If the merge is refused, the image is already published and the branch is left
      # in place, so the deploy is one click rather than a failed release.
      - name: Bump image tag in manifests (via PR)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.vars.outputs.image }}"
          TAG="${{ steps.vars.outputs.tag }}"
          FILE="deploy/base/deployment.yaml"
          BRANCH="release/${TAG}"

          sed -i -E "s#image: ${IMAGE}:[^ ]*#image: ${IMAGE}:${TAG}#" "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "manifest already points at ${TAG}; nothing to deploy"
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git commit -m "chore: deploy ${TAG}" -- "$FILE"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: deploy ${TAG}" \
            --body "Automated image bump to ${TAG} by the release workflow (run ${{ github.run_id }})."

          if gh pr merge "$BRANCH" --squash --delete-branch; then
            echo "deployed ${TAG}"
          else
            echo "::warning::image ${TAG} published, but the manifest PR needs a human merge"
          fi

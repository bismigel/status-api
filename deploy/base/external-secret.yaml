# Credentials for the checks, from Bitwarden Secrets Manager via External Secrets.
# One secret for the whole checker: the alternative is each watcher re-plumbing its
# own copy, which is how the same credential ends up in three places.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: status-api-checks-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: bitwarden }
  target:
    name: status-api-checks-secret
    creationPolicy: Owner
  data:
    - { secretKey: RADARR_API_KEY,   remoteRef: { key: radarr-api-key } }
    - { secretKey: SONARR_API_KEY,   remoteRef: { key: sonarr-api-key } }
    - { secretKey: PROWLARR_API_KEY, remoteRef: { key: prowlarr-api-key } }
    - { secretKey: JELLYFIN_API_KEY, remoteRef: { key: jellyfin-api-key } }
    # The qBittorrent credential is the same one the *arrs use; it already exists
    # in BWS as qbittorrent-password (the arr-auth ExternalSecret sources it too).
    - { secretKey: QBT_PASS,         remoteRef: { key: qbittorrent-password } }
    - { secretKey: STATUS_USER,      remoteRef: { key: status-api-user } }
    - { secretKey: STATUS_PASS,      remoteRef: { key: status-api-password } }

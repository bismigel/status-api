apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-api
spec:
  ingressClassName: nginx
  rules:
    - host: status.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status-api
                port:
                  number: 80
